name: Build Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore SunTime.csproj -p:TargetFrameworks=net10.0-android

      - name: Build Android
        run: dotnet build SunTime.csproj -f net10.0-android -c Release --no-restore

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/bin/Release/net10.0-android/**/*.apk
            **/bin/Release/net10.0-android/**/*.aab
          if-no-files-found: warn
