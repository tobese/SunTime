name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.cs"
      - "**/*.xaml"
      - "**/*.csproj"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.xaml"
      - "**/*.csproj"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore /p:TargetFramework=net10.0-android

      - name: Build APK
        run: dotnet publish -f net10.0-android -c Release /p:AndroidPackageFormat=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suntime-android-apk-${{ github.run_number }}
          path: |
            **/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
