name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install workloads
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore SunTime.csproj -p:TargetFrameworks=net10.0-browserwasm

      - name: Publish
        run: >
          dotnet publish SunTime.csproj
          -c Release
          -f net10.0-browserwasm
          -p:TargetFrameworks=net10.0-browserwasm
          -p:ContinuousIntegrationBuild=true
          --no-restore

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: suntime-browserwasm
          path: bin/Release/net10.0-browserwasm/publish/**
          if-no-files-found: error
