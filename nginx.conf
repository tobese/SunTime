worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Additional MIME types for WASM
    types {
        application/wasm wasm;
        application/octet-stream clr;
        application/octet-stream pdb;
        application/font-woff woff;
        application/font-woff woff2;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;

    # Gzip compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/wasm application/octet-stream;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Reverse-proxy API requests to the backend container
        location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback — serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "must-revalidate, max-age=3600";
        }

        # Long-cache immutable package assets
        location ~ ^/package_ {
            try_files $uri =404;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # Framework files — moderate cache
        location /_framework/ {
            try_files $uri =404;
            add_header Cache-Control "must-revalidate, max-age=3600";
        }
    }
}
